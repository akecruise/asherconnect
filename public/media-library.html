<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>คลังรูป · ASHER Connect</title><link rel="stylesheet" href="/fonts/plex.css"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/media-library.css"><script src="/image-library.js" defer></script><script src="/media-library.js" defer></script></head>
<body class="media-library-page"><header class="section-heading"><div><h1>คลังรูป</h1><p class="muted">รูปที่ทีมขายใช้ส่งให้ลูกค้า — เลือกได้จากปุ่ม “คลังรูป” ในช่องตอบแชต</p></div><div class="media-library-head-actions"><a class="button" href="/">← กลับแชต</a><button id="add" type="button" class="primary" hidden>+ เพิ่มรูปเข้าคลัง</button></div></header>
<div id="notice" class="notice" hidden></div>
<nav id="scope" class="saved-replies-tabs" role="tablist" hidden><button type="button" data-scope="library" class="active" role="tab" aria-selected="true">ใช้งานอยู่</button><button type="button" data-scope="manage" role="tab" aria-selected="false">ทั้งหมด (รวมรออนุมัติ/หมดอายุ)</button></nav>
<section id="uploader" hidden></section>
<div id="filters"></div>
<main id="grid" class="image-library-grid media-library-grid" aria-live="polite"></main>
<dialog id="editor"><form id="editor-form" method="dialog"><div class="section-heading"><h2>แก้ไขรูป</h2><button id="editor-close" type="button" aria-label="ปิด">×</button></div><img id="editor-preview" class="media-library-editor-preview" alt=""><label>ชื่อรูป<input id="editor-title" maxlength="160" required></label><div class="image-library-form-row"><label>โครงการ<select id="editor-project"><option value="naii">Asher Naii</option><option value="vibe">Asher Vibe</option><option value="all">ทุกโครงการ</option></select></label><label>หมวด<select id="editor-category"></select></label><label>หมดอายุ<input id="editor-expires" type="date"></label></div><label class="image-library-check"><input id="editor-bot" type="checkbox"> ให้บอทใช้รูปนี้ได้</label><p class="muted" id="editor-meta"></p><p id="editor-error" class="image-library-status error" role="alert"></p><div class="image-library-actions"><button id="editor-archive" type="button" class="danger-subtle">นำออกจากคลัง</button><button id="editor-approve" type="button" hidden>อนุมัติ</button><button id="editor-save" type="submit" class="primary">บันทึก</button></div></form></dialog>
</body></html>
