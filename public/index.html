<section class="conversation"><div id="empty" class="empty"><div class="empty-icon">↗</div><h2>พร้อมดูแลบทสนทนาถัดไป</h2><p>เลือกเคสจากกล่องข้อความ หรือดูเคสที่ยังไม่มีผู้รับ</p></div><div id="chat" hidden><div class="conversation-header"><div><small id="chat-channel"></small><h2 id="chat-name"></h2><span id="sla" class="pill"></span></div><div class="actions"><button id="claim" class="primary">รับเคส</button><button id="transfer" hidden>โอนเคส</button></div></div><div class="messages" id="messages" aria-live="polite"></div><button id="older" class="subtle">โหลดข้อความก่อนหน้า</button><form id="reply" class="composer"><div id="canned" class="canned"></div><label class="sr-only" for="message">ข้อความตอบลูกค้า</label><textarea id="message" maxlength="2000" placeholder="พิมพ์ข้อความตอบลูกค้า…" rows="3"></textarea><div class="composer-footer"><small id="send-hint">ตรวจข้อความก่อนกดส่ง</small><button class="primary" id="send">ส่งข้อความ ↗</button></div></form><div class="pipeline" id="pipeline"></div></div></section>
<aside class="lead-card" id="lead-card"><div id="lead-empty" class="muted">ข้อมูลลูกค้าจะแสดงเมื่อเลือกบทสนทนา</div><div id="lead-details" hidden><div class="section-heading"><h2>ข้อมูลลูกค้า</h2><small id="owner"></small></div><form id="lead-form"><label>ชื่อลูกค้า<input id="display-name" maxlength="200"></label><div class="form-row"><label>โครงการ<select id="project" required></select></label><label>ความสนใจ<select id="interest"><option value="unknown">ยังไม่ระบุ</option><option value="high">สูง</option><option value="medium">ปานกลาง</option><option value="low">ต่ำ</option></select></label></div><label>เบอร์โทร<input id="phone" type="tel" maxlength="40"></label><label>งบประมาณ (บาท)<input id="budget" type="number" min="0" max="999999999999" step="0.01"></label><label>รูปแบบห้อง<input id="room" maxlength="100" placeholder="เช่น 1 Bedroom"></label><label>ติดตามครั้งถัดไป · เวลาไทย<input id="followup" type="datetime-local"></label><button id="save" class="full">บันทึกข้อมูล</button></form><div class="appointment"><h3>นัดเข้าชมโครงการ</h3><p id="appointment-summary" class="muted">ยังไม่มีนัดหมาย</p><button id="appointment" class="full">＋ นัดเข้าชม</button></div><button id="close" class="subtle full">ปิดเคส / บันทึกเหตุผล</button></div></aside></main>
</section>
<dialog id="dialog"><form id="dialog-form"><div class="section-heading"><h2 id="dialog-title"></h2><button type="button" id="cancel" aria-label="ปิด">×</button></div><div id="dialog-fields"></div><p id="dialog-error" role="alert"></p><button class="primary full" id="dialog-submit">ยืนยัน</button></form></dialog>
</body></html>
