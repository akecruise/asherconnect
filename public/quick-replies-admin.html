<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Replies · ASHER Connect</title><link rel="stylesheet" href="/app.css"><style>body{padding:24px;max-width:980px;margin:auto}.toolbar{display:flex;gap:8px;align-items:center;margin:16px 0}.toolbar input{flex:1}.cards{display:grid;gap:8px}.card{border:1px solid var(--rule);padding:12px;border-radius:8px;display:flex;justify-content:space-between;gap:12px}.muted{color:var(--muted)}dialog{max-width:900px;width:calc(100% - 24px)}dialog form{display:grid;gap:10px}dialog label{display:grid;gap:4px}dialog textarea{min-height:130px}.row{display:flex;gap:8px}.row>*{flex:1}.counter{text-align:right;color:var(--muted);font-size:12px}table{width:100%;border-collapse:collapse}th,td{padding:6px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}td.message{white-space:pre-wrap;max-width:360px}@media(max-width:600px){body{padding:12px}.card{display:block}.row{display:grid}}#editor{box-sizing:border-box;width:calc(100% - 24px);max-width:540px;max-height:90dvh;overflow-y:auto;border-radius:16px;padding:20px}#editor input:not([type=hidden]),#editor textarea{box-sizing:border-box;width:100%;min-width:0;font-size:16px;min-height:44px}#editor button{min-height:44px}#editor textarea{min-height:180px}#editor .editor-actions{position:sticky;bottom:0;background:var(--surface,#fff);padding-top:10px}#editor-error{color:#b42318;margin:0}@media(max-width:600px){#editor .editor-actions{display:flex}#editor{padding:16px}} 
/* Connect-style full-screen saved-reply editor for mobile */
@media(max-width:767px){
 body.quick-replies-admin{box-sizing:border-box;min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));max-width:none;background:var(--paper)}
 .quick-replies-admin>.section-heading{position:sticky;top:0;z-index:2;align-items:center;margin:-4px -14px 12px;padding:8px 14px 12px;background:var(--paper);border-bottom:1px solid var(--rule)}
 .quick-replies-admin>.section-heading h1{font-size:20px;line-height:1.3;margin:0}
 .quick-replies-admin>.section-heading p{font-size:12px;margin:3px 0 0}
 .quick-replies-admin>.section-heading>.row{display:flex;flex:0 0 auto;gap:6px}
 .quick-replies-admin>.section-heading button{min-height:44px;padding:7px 10px;font-size:12px}
 .quick-replies-admin>.toolbar{position:sticky;top:70px;z-index:1;margin:0 -2px 12px;padding:4px 2px;background:var(--paper)}
 .quick-replies-admin>.toolbar input{min-width:0;font-size:16px}
 .quick-replies-admin>.toolbar button{flex:0 0 auto;min-height:44px;padding:7px 10px}
 .quick-replies-admin .card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:12px;border-radius:12px;background:var(--surface)}
 .quick-replies-admin .card>div:last-child{display:grid;gap:6px}
 .quick-replies-admin .card button{min-height:40px;padding:6px 10px;font-size:12px}
 #editor{box-sizing:border-box;position:fixed;inset:0;margin:0;width:100%;height:100%;max-width:none;max-height:none;border:0;border-radius:0;padding:0;background:var(--paper);color:var(--ink);overflow:auto}
 #editor::backdrop{background:var(--paper)}
 #editor form{box-sizing:border-box;display:flex;flex-direction:column;gap:14px;min-height:100%;padding:env(safe-area-inset-top) 16px calc(12px + env(safe-area-inset-bottom))}
 #editor .section-heading{position:sticky;top:0;z-index:1;min-height:52px;margin:0 -16px;padding:6px 16px 10px;background:var(--paper);border-bottom:1px solid var(--rule)}
 #editor .section-heading h2{font-size:18px;font-weight:600}
 #editor .section-heading button{width:44px;height:44px;padding:0;border-radius:50%;font-size:24px}
 #editor form>p.muted{margin:2px 0;color:var(--muted);font-size:13px;line-height:1.5}
 #editor label{gap:7px;font-size:14px;font-weight:600}
 #editor input:not([type=hidden]){height:48px;padding:10px 12px;border-radius:10px}
 #editor textarea{min-height:clamp(180px,34dvh,320px);padding:12px;border-radius:10px;resize:vertical}
 #editor .counter{font-size:12px}
 #editor .editor-actions{position:sticky;bottom:0;display:flex;gap:10px;margin:auto -16px 0;padding:12px 16px calc(8px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--rule)}
 #editor .editor-actions button{flex:1;min-height:48px;border-radius:12px}
}</style></head>
<body class="quick-replies-admin"><header class="section-heading"><div><h1>Quick replies</h1><p class="muted">จัดการข้อความตอบด่วนสำหรับทีม</p></div><div class="row"><button id="add" class="primary">+ เพิ่ม Quick Reply</button><button id="import-file" type="button">Import file</button></div></header>
<div class="toolbar"><input id="search" type="search" placeholder="ค้นหาชื่อ shortcut หรือข้อความ"><button id="back">กลับ Inbox</button></div><div id="notice" class="notice" hidden></div><main id="list" class="cards"></main>
<dialog id="editor"><form id="reply-editor-form" method="dialog"><div class="section-heading"><h2 id="form-title">Create saved reply</h2><button id="cancel" type="button" aria-label="ปิด">×</button></div><input id="id" type="hidden"><input id="title" type="hidden"><input id="category" type="hidden"><input id="sort" type="hidden"><input id="active" type="hidden"><p class="muted">เพิ่มคำย่อเพื่อเรียกใช้คำตอบอย่างรวดเร็ว ต้องมีอย่างน้อย 3 ตัวอักษร</p><label for="shortcut">Shortcut<input id="shortcut" required minlength="3" maxlength="40" placeholder="Add shortcut" autocomplete="off"></label><label for="body">Message<textarea id="body" maxlength="12000" required placeholder="Write a message…"></textarea></label><div class="counter"><span id="count">0</span>/12000</div><p id="editor-error" role="alert" hidden></p><div class="row editor-actions"><button id="save" type="submit" class="primary">บันทึก</button><button id="cancel2" type="button">ยกเลิก</button></div></form></dialog>
<dialog id="importer"><form method="dialog"><div class="section-heading"><h2>นำเข้า Quick Reply</h2><button id="import-cancel" type="button">×</button></div><label>ไฟล์ CSV / Excel (.xlsx)<input id="import-input" type="file" accept=".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label><p id="import-name" class="muted">ยังไม่ได้เลือกไฟล์</p><p class="muted">รองรับชีต Import_Data และจะละเว้นชีต Review_Notes</p><div class="row"><button id="import-preview" type="button" class="primary">ตรวจสอบข้อมูล</button><button id="import-template" type="button">ดาวน์โหลดไฟล์ตัวอย่าง</button><button id="import-cancel2" type="button">ยกเลิก</button></div><div id="import-preview-box" hidden><p id="import-summary" class="notice"></p><div style="overflow:auto;max-height:300px"><table><thead><tr><th>สถานะ</th><th>shortcut</th><th>ชื่อ</th><th>ข้อความ</th><th>หมวด</th><th>เปิดใช้งาน</th><th>ลำดับ</th><th>source</th></tr></thead><tbody id="import-rows"></tbody></table></div><button id="import-apply" type="button" class="primary" disabled>นำเข้า</button></div></form></dialog>
<script src="/quick-replies-admin.js" defer></script></body></html>
