+<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Replies · ASHER Connect</title><link rel="stylesheet" href="/app.css"><style>body{padding:24px;max-width:980px;margin:auto}.toolbar{display:flex;gap:8px;align-items:center;margin:16px 0}.toolbar input{flex:1}.cards{display:grid;gap:8px}.card{border:1px solid var(--rule);padding:12px;border-radius:8px;display:flex;justify-content:space-between;gap:12px}.muted{color:var(--muted)}dialog{max-width:900px;width:calc(100% - 24px)}dialog form{display:grid;gap:10px}dialog label{display:grid;gap:4px}dialog textarea{min-height:130px}.row{display:flex;gap:8px}.row>*{flex:1}.counter{text-align:right;color:var(--muted);font-size:12px}table{width:100%;border-collapse:collapse}th,td{padding:6px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}td.message{white-space:pre-wrap;max-width:360px}@media(max-width:600px){body{padding:12px}.card{display:block}.row{display:grid}}</style></head>
<body><header class="section-heading"><div><h1>Quick replies</h1><p class="muted">จัดการข้อความตอบด่วนสำหรับทีม</p></div><div class="row"><button id="add" class="primary">+ เพิ่ม Quick Reply</button><button id="import-file" type="button">Import file</button></div></header>
<div class="toolbar"><input id="search" type="search" placeholder="ค้นหาชื่อ shortcut หรือข้อความ"><button id="back">กลับ Inbox</button></div><div id="notice" class="notice" hidden></div><main id="list" class="cards"></main>
<dialog id="editor"><form method="dialog"><div class="section-heading"><h2 id="form-title">เพิ่ม Quick Reply</h2><button id="cancel" type="button">×</button></div><input id="id" type="hidden"><label>ชื่อ template<input id="title" required maxlength="120"></label><div class="row"><label>Shortcut<input id="shortcut" required maxlength="40" placeholder="NAII_LOC"></label><label>หมวด<select id="category"><option>ราคา</option><option>โปรโมชั่น</option><option>นัดชม</option><option>ทำเล</option><option>ห้องว่าง</option><option>การจอง</option></select></label></div><label>Message<textarea id="body" maxlength="12000" required></textarea><div class="counter"><span id="count">0</span>/12000</div><div class="row"><label>Sort order<input id="sort" type="number" value="100"></label><label>สถานะ<select id="active"><option value="true">Active</option><option value="false">Inactive</option></select></label></div><div class="row"><button id="save" class="primary" value="default">บันทึก</button><button id="cancel2" type="button">ยกเลิก</button></div></form></dialog>
<dialog id="importer"><form method="dialog"><div class="section-heading"><h2>นำเข้า Quick Reply</h2><button id="import-cancel" type="button">×</button></div><label>ไฟล์ CSV / Excel (.xlsx)<input id="import-input" type="file" accept=".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label><p id="import-name" class="muted">ยังไม่ได้เลือกไฟล์</p><p class="muted">รองรับชีต Import_Data และจะละเว้นชีต Review_Notes</p><div class="row"><button id="import-preview" type="button" class="primary">ตรวจสอบข้อมูล</button><button id="import-template" type="button">ดาวน์โหลดไฟล์ตัวอย่าง</button><button id="import-cancel2" type="button">ยกเลิก</button></div><div id="import-preview-box" hidden><p id="import-summary" class="notice"></p><div style="overflow:auto;max-height:300px"><table><thead><tr><th>สถานะ</th><th>shortcut</th><th>ชื่อ</th><th>ข้อความ</th><th>หมวด</th><th>เปิดใช้งาน</th><th>ลำดับ</th><th>source</th></tr></thead><tbody id="import-rows"></tbody></table></div><button id="import-apply" type="button" class="primary" disabled>นำเข้า</button></div></form></dialog>
<script src="/quick-replies-admin.js" defer></script></body></html>
