<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Replies · ASHER Connect</title><link rel="stylesheet" href="/app.css"><style>body{padding:24px;max-width:980px;margin:auto}.toolbar{display:flex;gap:8px;align-items:center;margin:16px 0}.toolbar input{flex:1}.cards{display:grid;gap:8px}.card{border:1px solid var(--rule);padding:12px;border-radius:8px;display:flex;justify-content:space-between;gap:12px}.muted{color:var(--muted)}dialog{max-width:560px;width:calc(100% - 24px)}dialog form{display:grid;gap:10px}dialog label{display:grid;gap:4px}dialog textarea{min-height:130px}.row{display:flex;gap:8px}.row>*{flex:1}.counter{text-align:right;color:var(--muted);font-size:12px}@media(max-width:600px){body{padding:12px}.card{display:block}.row{display:grid}}</style></head><body><header class="section-heading"><div><h1>Quick Replies</h1><p class="muted">จัดการข้อความตอบด่วนสำหรับทีม</p></div><button id="add" class="primary">+ เพิ่ม Quick Reply</button></header><div class="toolbar"><input id="search" type="search" placeholder="ค้นหาชื่อ shortcut หรือข้อความ"><button id="back">กลับ Inbox</button></div><div id="notice" class="notice" hidden></div><main id="list" class="cards"></main><dialog id="editor"><form method="dialog"><div class="section-heading"><h2 id="form-title">เพิ่ม Quick Reply</h2><button id="cancel" type="button">×</button></div><input id="id" type="hidden"><label>ชื่อ template<input id="title" required maxlength="120"></label><div class="row"><label>Shortcut<input id="shortcut" required maxlength="40" placeholder="ราคา"></label><label>หมวด<select id="category"><option>ราคา</option><option>โปรโมชั่น</option><option>นัดชม</option><option>ทำเล</option><option>ห้องว่าง</option><option>การจอง</option></select></label></div><label>Message<textarea id="body" maxlength="2000" required></textarea><div class="counter"><span id="count">0</span>/2000</div><div class="row"><label>Sort order<input id="sort" type="number" value="100"></label><label>สถานะ<select id="active"><option value="true">Active</option><option value="false">Inactive</option></select></label></div><p class="muted">รูปแนบจัดการผ่าน media asset ของ Supabase และจะถูกแสดงใน picker เมื่อผูกกับ template</p><div class="row"><button id="save" class="primary" value="default">บันทึก</button><button id="cancel2" type="button">ยกเลิก</button></div></form></dialog><script src="/quick-replies-admin.js" defer></script></body></html>
